name: portofolio
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rive: ^0.13.20
  animated_text_kit: ^4.2.3
  google_fonts: ^6.3.0
  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/rives/

  fonts:
    - family: Horizon
      fonts:
        - asset: assets/fonts/Horizon.otf
